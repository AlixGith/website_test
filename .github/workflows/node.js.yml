name: node yml 
on:
  workflow_dispatch:
    
jobs:
  veracode:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 16

    
    - name: Download and extract player
      run: |
        git clone https://gitlab.com/omaradio/player.git soundbase/player


    - run: npm install
      working-directory: ./player

    - run: npm run build
      working-directory: ./player