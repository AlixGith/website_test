on:
  push:
    branches:
      - main # ou la branche que vous utilisez pour le déploiement (par exemple, master)
  workflow_dispatch: # Permet de déclencher le workflow manuellement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Nécessaire pour publier sur GitHub Pages
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract soundbase
        run: |
          wget https://static.jean-cloud.net/oma-soundbases/soundbase_dev_latest.zip
          # Crée le dossier 'soundbase' et y extrait le contenu
          mkdir -p soundbase
          unzip soundbase_dev_latest.zip -d soundbase

      - name: Download and extract player
        run: |
           git clone https://gitlab.com/omaradio/player.git -d soundbase
      - name: Extract content
        run: |
          unzip src/wp-content.zip -d src/

      - name : Include
        run : cargo add include_dir
        # NOUVELLE ÉTAPE : Déplacer l'index.html de la racine vers le dossier soundbase
      - name: Move root index.html to soundbase
        run: mv index.html soundbase/index.html
        
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      # Votre commande pour construire et exécuter l'application Rust
      - name: Build and run Rust application
        # Si votre application Rust est configurée pour chercher les templates
        # dans un chemin relatif au répertoire de travail de 'cargo run',
        # alors elle devrait maintenant trouver 'src/templates/'.
        run: cargo run --release -- --soundbase-path "./soundbase" --output "./soundbase/website" --soundbase-prefix '../' --website-prefix "/website_test/website" --radio-host "" --player-url "../player"


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./soundbase

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

