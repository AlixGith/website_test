on:
  push:
    branches:
      - main # ou la branche que vous utilisez pour le déploiement (par exemple, master)
  workflow_dispatch: # Permet de déclencher le workflow manuellement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Nécessaire pour publier sur GitHub Pages
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Nouvelle étape pour télécharger et extraire la soundbase
      - name: Download and extract soundbase
        run: |
          wget https://static.jean-cloud.net/oma-soundbases/soundbase_dev_latest.zip
          # Crée le dossier 'soundbase' et y extrait le contenu
          unzip soundbase_dev_latest.zip -d soundbase

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Build Rust project
        run: |
          # Utilisation de 'cargo run --release' pour exécuter le programme
          # --soundbase-path ./soundbase : Assurez-vous que ce chemin correspond à l'endroit où 'unzip' a extrait la base.
          # --output public : Le répertoire de sortie pour le site statique, qui sera ensuite uploadé.
          # --website-prefix /website_test : Le préfixe de base pour les URL du site (important pour GitHub Pages si le site est dans un sous-dossier).
          # --player-url /website_test/player : Le chemin spécifique pour les ressources du player.
          cargo run --release -- \n            --soundbase-path ./soundbase \n            --radio-host 'https://myradio.example.com' \n            --output public \n            --website-prefix /website_test \n            --player-url /website_test/player
    
      - name: List public directory content
        run: ls -R public # Ajouté pour le débogage
    
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
