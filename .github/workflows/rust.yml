on:
  push:
    branches:
      - main # ou la branche que vous utilisez pour le déploiement (par exemple, master)
  workflow_dispatch: # Permet de déclencher le workflow manuellement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Nécessaire pour publier sur GitHub Pages
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Debug: List entire workspace content from root
        run: |
          echo "Listing entire workspace content from root:"
          ls -R .
          echo "--- End of workspace content ---"
          
      # Nouvelle étape pour télécharger et extraire la soundbase
      - name: Download and extract soundbase
        run: |
          wget https://static.jean-cloud.net/oma-soundbases/soundbase_dev_latest.zip
          # Crée le dossier 'soundbase' et y extrait le contenu
          unzip soundbase_dev_latest.zip -d soundbase
          mkdir -p soundbase/website # Crée le répertoire 'website' à l'intérieur de 'soundbase'


