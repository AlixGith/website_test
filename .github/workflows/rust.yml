name: Deploy Rust Project to GitHub Pages

on:
  push:
    branches:
      - main # ou la branche que vous utilisez pour le déploiement (par exemple, master)
  workflow_dispatch: # Permet de déclencher le workflow manuellement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Nécessaire pour publier sur GitHub Pages
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Build Rust project
        run: |
          # Remplacez <chemin_vers_soundbase> et <votre_radio_host> par les valeurs réelles de votre projet.
          # Le répertoire de sortie est défini ici comme 'public'.
          cargo run --release -- \n            --soundbase-path ./data/soundbase \n            --radio-host https://myradio.example.com \n            --output public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public # Doit correspondre à l'argument --output ci-dessus

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
