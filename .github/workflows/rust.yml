on:
  push:
    branches:
      - main # ou la branche que vous utilisez pour le déploiement (par exemple, master)
  workflow_dispatch: # Permet de déclencher le workflow manuellement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Nécessaire pour publier sur GitHub Pages
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract soundbase
        run: |
          wget https://static.jean-cloud.net/oma-soundbases/soundbase_dev_latest.zip
          # Crée le dossier 'soundbase' et y extrait le contenu
          unzip soundbase_dev_latest.zip -d soundbase
          mkdir -p soundbase/website # Crée le répertoire 'website' à l'intérieur de 'soundbase'

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

     # Cette étape de débogage a été utile, vous pouvez la garder ou la retirer si vous le souhaitez
      - name: Debug List entire workspace content from root
        run: |
          echo "Listing entire workspace content from root:"
          ls -R .
          echo "--- End of workspace content ---"

      # Étape de débogage pour lister le contenu du répertoire templates (avec le chemin correct)
      - name: Debug List templates directory content
        run: |
          echo "Contents of src/templates/ directory:"
          ls -R src/templates/ # <-- Chemin corrigé ici
          echo "---"

      # Étape de débogage pour vérifier la présence et le contenu de serie.html (avec le chemin correct)
      - name: Debug Check for serie.html content
        run: |
          if [ -f src/templates/serie.html ]; then # <-- Chemin corrigé ici
            echo "src/templates/serie.html exists. Its content:"
            cat src/templates/serie.html # <-- Chemin corrigé ici
          else
            echo "ERROR: src/templates/serie.html DOES NOT EXIST!"
          fi
          echo "---"

      # Votre commande pour construire et exécuter l'application Rust
      - name: Build and run Rust application
        # Si votre application Rust est configurée pour chercher les templates
        # dans un chemin relatif au répertoire de travail de 'cargo run',
        # alors elle devrait maintenant trouver 'src/templates/'.
        run: cargo run --release -- --soundbase-path ./soundbase --radio-host 'https://myradio.example.com' --output public --website-prefix /website_test --player-url /website_test/player
    
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

