name: Deploy Rust Project to GitHub Pages

on:
  push:
    branches:
      - main # ou la branche que vous utilisez pour le déploiement (par exemple, master)
  workflow_dispatch: # Permet de déclencher le workflow manuellement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Nécessaire pour publier sur GitHub Pages
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable # ou la version de Rust que vous utilisez
          override: true
          profile: minimal

      - name: Build Rust project
        run: |
          # Remplacez cette commande par celle qui construit votre site statique.
          # Exemples :
          # - Si c'est un générateur de site statique Rust qui génère dans 'public' :
          #   cargo run --release -- build
          # - Si c'est un projet WebAssembly avec wasm-pack :
          #   cargo install wasm-pack
          #   wasm-pack build --target web --out-dir public
          # - Si vous avez une autre méthode pour générer les fichiers statiques :
          #   <votre commande de build>
          
          # Pour cet exemple, nous allons créer un fichier index.html simple.
          # Vous devrez remplacer ceci par la commande de build réelle de votre projet.
          mkdir -p target/site
          echo "<h1>Hello from Rust on GitHub Pages!</h1><p>Build time: $(date)</p>" > target/site/index.html
          echo "Contenu de votre site Rust" > target/site/index.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site # Le répertoire contenant vos fichiers statiques à déployer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
