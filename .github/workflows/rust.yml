name: Deploy Rust Project to GitHub Pages

on:
  push:
    branches:
      - main # ou la branche que vous utilisez pour le déploiement (par exemple, master)
  workflow_dispatch: # Permet de déclencher le workflow manuellement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Nécessaire pour publier sur GitHub Pages
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Build Rust project
        run: cargo run --release -- --soundbase-path ./data/soundbase --radio-host 'https://myradio.example.com' --output public --website-prefix /website_test --player-url /website_test/player
    
      - name: List public directory content
        run: ls -R public # Ajouté pour le débogage
    
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publics

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
